# Grok Build / Grok CLI — MCP stdio server sample for pulsechain-mcp
#
# RESEARCH-ONLY (agent install default). No secrets in this file.
#
# Install locations (pick one):
#   User (all projects):     ~/.grok/config.toml   (Windows: %USERPROFILE%\.grok\config.toml)
#   Project (this repo):     .grok/config.toml
#
# Prefer the installer (fills absolute paths, mode fork, no secrets):
#   node scripts/install-for-host.mjs --host grok --mode research
#   node scripts/install-for-host.mjs --host grok --mode wallets
#
# Prerequisites:
#   1. Node.js 20+ on PATH (or set command to absolute path of node)
#   2. npm install && npm run build  →  dist/index.js must exist
#   3. Replace REPLACE_WITH_ABSOLUTE_PATH with your absolute clone ROOT path only
#      (the directory that contains dist/ and package.json — not a parent folder).
#
# Agent default: research-only (wallets off). Promote to wallets-on only when the
# user asks to sign — then use scripts/start-wallet-mcp.mjs + gitignored .env.wallet
# (node scripts/generate-wallet-env.mjs). NEVER put AGENT_WALLET_MASTER_KEY here.
#
# Do NOT set HTTP_TRANSPORT_PORT (stdio clients need stdout for JSON-RPC).
#
# Pre-reload:  grok mcp doctor pulsechain-mcp  (handshake only — not tools in this chat)
# After reload (new session): pulsechain_health → agent_wallet_status → get_rpc_health
# Version: match package.json / npm pkg get version (do not hardcode).
#
# Optional CLI: grok mcp add … is fine for research-only flags, but avoid
# -e AGENT_WALLET_MASTER_KEY=… (lands in config/transcripts). Prefer launcher + .env.wallet.
# See docs/BOOTSTRAP.md, docs/SECURITY.md.

[mcp_servers.pulsechain-mcp]
command = "node"
args = ["REPLACE_WITH_ABSOLUTE_PATH/dist/index.js"]
enabled = true
# Cold start after first build is usually fine; raise if doctor times out:
startup_timeout_sec = 45
tool_timeout_sec = 120

[mcp_servers.pulsechain-mcp.env]
PULSECHAIN_RPC_URLS = "https://rpc-pulsechain.g4mm4.io,https://rpc.pulsechain.com,https://pulsechain.publicnode.com,https://rpc.pulsechainstats.com"
PULSECHAIN_EXPLORER_API = "https://api.scan.pulsechain.com/api"
PULSEX_SUBGRAPH_V1 = "https://graph.pulsechain.com/subgraphs/name/pulsechain/pulsex"
PULSEX_SUBGRAPH_V2 = "https://graph.pulsechain.com/subgraphs/name/pulsechain/pulsexv2"
HTTP_TIMEOUT_MS = "30000"
AGENT_WALLET_ENABLED = "false"
LOG_LEVEL = "info"
