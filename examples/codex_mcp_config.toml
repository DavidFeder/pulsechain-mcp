# OpenAI Codex (CLI / IDE / ChatGPT desktop Codex host) — MCP stdio sample for pulsechain-mcp
#
# RESEARCH-ONLY (agent install default). No secrets in this file.
#
# Install locations (pick one):
#   User (all projects):     ~/.codex/config.toml   (Windows: %USERPROFILE%\.codex\config.toml)
#   Project (trusted only):  .codex/config.toml
#
# Prefer the installer:
#   node scripts/install-for-host.mjs --host codex --mode research
#   node scripts/install-for-host.mjs --host codex --mode wallets
#
# UI alternative:
#   ChatGPT desktop / Codex IDE: Settings → MCP servers → Add server (STDIO)
#   CLI: codex mcp add pulsechain-mcp --env KEY=VALUE -- node REPLACE_WITH_ABSOLUTE_PATH/dist/index.js
#        (prefer editing this file when many env vars are needed; never pass MASTER_KEY on CLI)
#
# Prerequisites:
#   1. Node.js 20+ on PATH (or set command to absolute path of node)
#   2. npm install && npm run build  →  dist/index.js must exist
#   3. Replace REPLACE_WITH_ABSOLUTE_PATH with your absolute clone ROOT only
#      (directory that contains dist/ and package.json — not a parent folder).
#
# Agent default: research-only. Wallets-on: scripts/start-wallet-mcp.mjs + .env.wallet
# (node scripts/generate-wallet-env.mjs). NEVER embed AGENT_WALLET_MASTER_KEY here.
#
# Do NOT set HTTP_TRANSPORT_PORT (stdio clients need stdout for JSON-RPC).
#
# Codex-specific notes:
#   - Table key is [mcp_servers.<name>] (not mcp.servers).
#   - Shared config across Codex CLI, IDE extension, and ChatGPT desktop Codex host.
#   - startup_timeout_sec default is short (~10s); raise after cold build if needed.
#   - tool_timeout_sec: raise for slow RPC / aggregator tools.
#
# Pre-reload: codex mcp list / restart extension. Post-reload: pulsechain_health →
# agent_wallet_status → get_rpc_health. Version: match package.json (do not hardcode).
# See docs/BOOTSTRAP.md, docs/AGENT_GUIDANCE.md, docs/SECURITY.md.

[mcp_servers.pulsechain-mcp]
command = "node"
args = ["REPLACE_WITH_ABSOLUTE_PATH/dist/index.js"]
enabled = true
# Cold start after first build is usually fine; raise if list/connect times out:
startup_timeout_sec = 45
tool_timeout_sec = 120

[mcp_servers.pulsechain-mcp.env]
PULSECHAIN_RPC_URLS = "https://rpc-pulsechain.g4mm4.io,https://rpc.pulsechain.com,https://pulsechain.publicnode.com,https://rpc.pulsechainstats.com"
PULSECHAIN_EXPLORER_API = "https://api.scan.pulsechain.com/api"
PULSEX_SUBGRAPH_V1 = "https://graph.pulsechain.com/subgraphs/name/pulsechain/pulsex"
PULSEX_SUBGRAPH_V2 = "https://graph.pulsechain.com/subgraphs/name/pulsechain/pulsexv2"
HTTP_TIMEOUT_MS = "30000"
AGENT_WALLET_ENABLED = "false"
LOG_LEVEL = "info"
